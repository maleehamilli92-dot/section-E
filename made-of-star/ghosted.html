<!DOCTYPE html>

  <div class="gallery-grid">
   
    <div class="card item-1"><img src="./imagess/image-1.jpg" alt="Stairs"></div>

    <div class="card item-8"><img src="./imagess/image-8.jpg" alt="Room"></div>

   
    <div class="card item-9"><img src="./imagess/image-9.jpg" alt="Blueprint"></div>
    <div class="card item-10"><img src="./imagess/image-10.jpg" alt="Stairs Detail"></div>
    <div class="card item-11"><img src="./imagess/image-11.jpg" alt="Fabric"></div>

  </div>
